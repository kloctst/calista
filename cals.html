<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calista</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', cursive, sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #ffd6e8);
      color: #ff3399;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      transition: background 1s;
    }

    h1 {
      font-size: 3em;
      margin: 0.2em;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 1em;
    }

    button {
      background-color: #ff66b2;
      color: white;
      border: none;
      padding: 0.8em 1.5em;
      font-size: 1em;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, background-color 0.3s;
    }

    button:hover {
      background-color: #ff3385;
      transform: scale(1.05);
    }

    .flirty-text {
      font-style: italic;
      color: #cc0066;
      margin-top: 1em;
      opacity: 0;
      transition: opacity 1s;
    }

    .show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>Hallo, Calista 😘</h1>
  <p>Mau kenalan lebih dekat nggak cantik?</p>
  <button onclick="flirt()">Klik aku 💕</button>

  <div id="flirtyText" class="flirty-text"></div>

  <script>
    const flirts = [
      "Hmm... kamu lucu juga ya 😘",
      "Udah makan belum? Boleh aku temenin ga 💋",
      "Kalo kamu salting, salting aja gpp lucu soalnya~ 😍",
      "Aku suka yang perhatian... kayak kamu ❤️",
      "Kalau aku bilang kamu manis, kamu marah nggak? 😚"
    ];

    function flirt() {
      const msg = flirts[Math.floor(Math.random() * flirts.length)];
      const div = document.getElementById("flirtyText");
      div.textContent = msg;
      div.classList.add("show");
    }
  </script>

</body>
</html>
